<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f3f7f8;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .image-card {
            overflow: hidden;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .image-card:hover {
            transform: scale(1.03);
        }

        .image-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s ease;
            z-index: 9999;
        }

        #lightbox.visible {
            visibility: visible;
            opacity: 1;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        .btn {
            position: absolute;
            color: white;
            font-size: 50px;
            cursor: pointer;
            user-select: none;
        }

        #closeBtn {
            top: 20px;
            right: 40px;
            font-size: 45px;
        }

        #prevBtn {
            left: 40px;
        }

        #nextBtn {
            right: 40px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 style="text-align:center; margin-bottom:20px; font-size:48px; font-weight:bold;">
    Image Gallery
</h2>


        <div class="image-grid">
            <div class="image-card"><img src="itachi.png" alt=""></div>
            <div class="image-card"><img src="pain.png" alt=""></div>
            <div class="image-card"><img src="konan.png" alt=""></div>
            <div class="image-card"><img src="../static/image.png" alt=""></div>
            <div class="image-card"><img src="../static/light.jpg" alt=""></div>
            <div class="image-card"><img src="../static/image.png" alt=""></div>
             
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox">
        <span class="btn" id="closeBtn">&times;</span>
        <span class="btn" id="prevBtn">&#10094;</span>
        <img src="" id="lightImg">
        <span class="btn" id="nextBtn">&#10095;</span>
    </div>

    <script>
        const cards = document.querySelectorAll(".image-card img");
        const lightbox = document.getElementById("lightbox");
        const lightImg = document.getElementById("lightImg");
        const closeBtn = document.getElementById("closeBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        let index = 0;

        function showLightbox(i) {
            index = i;
            lightImg.src = cards[i].src;
            lightbox.classList.add("visible");
        }

        cards.forEach((img, i) => {
            img.addEventListener("click", () => showLightbox(i));
        });

        closeBtn.onclick = () => lightbox.classList.remove("visible");

        prevBtn.onclick = () => {
            index = (index - 1 + cards.length) % cards.length;
            lightImg.src = cards[index].src;
        };

        nextBtn.onclick = () => {
            index = (index + 1) % cards.length;
            lightImg.src = cards[index].src;
        };

        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) lightbox.classList.remove("visible");
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") lightbox.classList.remove("visible");
        });
    </script>

</body>
</html>
